version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ferresys-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferreuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrepass123}
      POSTGRES_DB: ${POSTGRES_DB:-ferresys_db}
    ports:
      - "${DB_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ferresys-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ferresys-backend
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferreuser}:${POSTGRES_PASSWORD:-ferrepass123}@db:5432/${POSTGRES_DB:-ferresys_db}?schema=public
    ports:
      - "${BACKEND_PORT:-3080}:3000"
    depends_on:
      - db
    networks:
      - ferresys-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ferresys-web
    restart: always
    environment:
      - VITE_PORT=5180
      - BACKEND_URL=http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5182}:5180"
    depends_on:
      - backend
    networks:
      - ferresys-network

volumes:
  postgres_data:

networks:
  ferresys-network:
    driver: bridge
